<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1f5ee"><title>Area Grid - Pair &amp; Fill</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1f5ee;font:16px system-ui,sans-serif;color:#0d3360}#unity-canvas{position:fixed;left:env(safe-area-inset-left);top:env(safe-area-inset-top);width:calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));display:block;touch-action:none;outline:none}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:14px;background:#f1f5ee}h1{font-size:32px;letter-spacing:.06em;margin:0}p{margin:0;color:#5d6f7e}progress{width:250px;height:10px;accent-color:#1976da}#error{max-width:320px;line-height:1.6}button{padding:12px 22px;border:0;border-radius:8px;background:#1976da;color:white;font:inherit}</style></head>
<body><canvas id="unity-canvas" tabindex="0" aria-label="Area Grid puzzle. Drag across cells to pair two numbers in each rectangle. Their sum must equal its area."></canvas><div id="loading" role="status"><h1>AREA GRID</h1><p>Two numbers. One rectangle.</p><progress id="progress" max="1" value="0" aria-label="Loading game"></progress><p id="error">Loading your puzzle…</p></div>
<script src="Build/{{{ LOADER_FILENAME }}}"></script><script>
const canvas=document.getElementById('unity-canvas');
canvas.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(e.target===canvas)e.preventDefault();},{passive:false});
createUnityInstance(canvas,{
 dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',
 streamingAssetsUrl:'StreamingAssets',companyName:'{{{ COMPANY_NAME }}}',productName:'Area Grid',productVersion:'{{{ PRODUCT_VERSION }}}',
 devicePixelRatio:Math.min(window.devicePixelRatio||1,2),autoSyncPersistentDataPath:false,
 showBanner:(message,type)=>{if(type==='error'){document.getElementById('error').textContent='Unable to load the game. Please reload and try again.';}}
},p=>document.getElementById('progress').value=p).then(instance=>{
 window.areaGridInstance=instance;document.getElementById('loading').remove();canvas.focus();
}).catch(error=>{
 document.getElementById('error').textContent='The game could not start. Try reloading, or use a browser with WebGL enabled.';
 const retry=document.createElement('button');retry.textContent='Reload game';retry.onclick=()=>location.reload();document.getElementById('loading').appendChild(retry);console.error(error);
});
</script></body></html>
